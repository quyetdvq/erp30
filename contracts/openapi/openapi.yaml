components:
  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      schema:
        type: string
        enum: [vi, en]
        default: vi
        description: Supported request language. Unsupported values fall back to vi.
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: Client request correlation identifier; invalid or missing values are replaced by a generated UUID.
      schema:
        $ref: '#/components/schemas/RequestId'
    Id:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/BigInt'
    Q:
      name: q
      in: query
      required: false
      schema:
        type: string
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Sort:
      name: sort
      in: query
      required: false
      schema:
        type: string
      description: Allowlisted comma-separated sort terms; a final id ASC tie-breaker is applied.
    Filter:
      name: filter
      in: query
      required: false
      style: deepObject
      explode: true
      schema:
        type: object
        additionalProperties:
          oneOf:
            - type: string
            - type: array
              items: {type: string}
    DisplayOrganizationId:
      name: organization_id
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/PositiveBigInt'
    DisplayContextType:
      name: context_type
      in: query
      required: true
      schema:
        type: string
        enum: [SYSTEM, ORGANIZATION]
  requestBodies:
    AuthLogin: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AuthLogin'}}}}
    AuthProfilePatch: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AuthProfilePatch'}}}}
