components:
  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      schema:
        type: string
        enum: [vi, en]
        default: vi
        description: Supported request language. Unsupported values fall back to vi.
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: Client request correlation identifier; invalid or missing values are replaced by a generated UUID.
      schema:
        $ref: '#/components/schemas/RequestId'
    Id:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/BigInt'
    Q:
      name: q
      in: query
      required: false
      schema:
        type: string
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Sort:
      name: sort
      in: query
      required: false
      schema:
        type: string
      description: Allowlisted comma-separated sort terms; a final id ASC tie-breaker is applied.
    Filter:
      name: filter
      in: query
      required: false
      style: deepObject
      explode: true
      schema:
        type: object
        additionalProperties:
          oneOf:
            - type: string
            - type: array
              items: {type: string}
  requestBodies:
    ProvinceCreate: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ProvinceCreate'}}}}
    ProvincePatch: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ProvincePatch'}}}}
    WardCreate: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/WardCreate'}}}}
    WardPatch: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/WardPatch'}}}}
    OrganizationCreate: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/OrganizationCreate'}}}}
    OrganizationPatch: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/OrganizationPatch'}}}}
    ContactCreate: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ContactCreate'}}}}
    ContactPatch: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ContactPatch'}}}}
    State: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/State'}}}}
    DepartmentCreate: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DepartmentCreate'}}}}
    DepartmentPatch: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DepartmentPatch'}}}}
    DepartmentState: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DepartmentState'}}}}
    PositionCreate: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PositionCreate'}}}}
    PositionPatch: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PositionPatch'}}}}
    PositionState: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PositionState'}}}}
    EmployeeCreate: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/EmployeeCreate'}}}}
    EmployeePatch: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/EmployeePatch'}}}}
    EmployeeState: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/EmployeeState'}}}}
    EmployeeAssignmentCreate: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/EmployeeAssignmentCreate'}}}}
    EmployeeAssignmentPatch: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/EmployeeAssignmentPatch'}}}}
    EmployeeAssignmentState: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/EmployeeAssignmentState'}}}}
  securitySchemes:
    sessionAuth:
      type: http
      scheme: bearer
  headers:
    RequestId:
      description: Accepted or generated request correlation identifier.
      schema:
        $ref: '#/components/schemas/RequestId'
    ContentLanguage:
      description: Resolved language for human-readable response text.
      schema:
        type: string
        enum: [vi, en]
  responses:
    ProvinceResponse:
      description: Province resource.
      content: {application/json: {schema: {$ref: '#/components/schemas/ProvinceResponse'}}}
    ProvinceCollection:
      description: Authorized province collection.
      content: {application/json: {schema: {$ref: '#/components/schemas/ProvinceCollection'}}}
    WardResponse:
      description: Ward resource.
