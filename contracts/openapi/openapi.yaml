    EmployeeAssignmentCollection:
      description: Authorized employee assignment collection.
      content: {application/json: {schema: {$ref: '#/components/schemas/EmployeeAssignmentCollection'}}}
    BadRequest:
      description: Malformed request or query.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Unauthenticated or invalid authentication.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Visible target but action denied.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Target not found or not visible.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflict, concurrency, uniqueness, or current-state failure.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            policyScopeAlreadyExists:
              summary: Duplicate Policy scope
              value:
                error:
                  code: POLICY_SCOPE_ALREADY_EXISTS
                  message: A Policy already exists for this scope.
                  details: [{field: scope, code: POLICY_SCOPE_ALREADY_EXISTS, message: A Policy already exists for this scope.}]
                meta: {request_id: 00000000-0000-4000-8000-000000000000}
    UnprocessableEntity:
      description: Semantically invalid request.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Unexpected server error without internal diagnostics.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    RequestId:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[0-9A-Za-z][0-9A-Za-z._:-]{0,127}$'
      description: Request correlation identifier echoed in the response header and meta.request_id.
    BigInt:
      type: string
      pattern: '^-?[0-9]+$'
      description: Database BIGINT values are serialized as JSON strings.
    NullableBigInt:
      oneOf:
        - {$ref: '#/components/schemas/BigInt'}
        - type: 'null'
    Decimal:
      type: string
      pattern: '^-?(0|[1-9][0-9]*)(\.[0-9]+)?$'
      description: Exact decimal, money, and quantity values are serialized as JSON strings.
    SuccessResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data: {}
        meta:
          $ref: '#/components/schemas/Meta'
    CollectionMeta:
      type: object
      required:
        - page
        - page_size
        - total
        - request_id
      properties:
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
          description: Number of records after authorization and data-scope filtering.
        request_id:
          $ref: '#/components/schemas/RequestId'
    CollectionResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items: {}
        meta:
          $ref: '#/components/schemas/CollectionMeta'
    Meta:
      type: object
      required:
        - request_id
      properties:
        request_id:
          $ref: '#/components/schemas/RequestId'
    ErrorDetail:
      type: object
      required:
        - field
        - code
        - message
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
    Error:
      type: object
      required:
        - code
        - message
        - details
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
    ErrorResponse:
      type: object
      required:
        - error
        - meta
      properties:
        error:
          $ref: '#/components/schemas/Error'
        meta:
          $ref: '#/components/schemas/Meta'
    HealthData:
      type: object
      required:
        - service
        - status
        - timestamp
      properties:
        service:
          type: string
        status:
          type: string
          const: ok
        timestamp:
          type: string
          format: date-time
    PositiveBigInt:
      type: string
      pattern: '^[1-9][0-9]*$'
      description: Positive database BIGINT serialized as a JSON string.
    DisplaySettingsRuntime:
      type: object
      required: [timezone, date, number, money]
      properties:
        timezone: {type: string}
        date:
          type: object
          required: [format, date_time_format, time_format, first_day_of_week]
          properties:
            format: {type: string}
            date_time_format: {type: string}
            time_format: {type: string}
            first_day_of_week: {type: string}
        number:
          type: object
          required: [decimal_separator, group_separator, quantity_decimals, percentage_decimals, trailing_zeros]
          properties:
            decimal_separator: {type: string}
            group_separator: {type: string}
            quantity_decimals: {type: integer, minimum: 0}
            percentage_decimals: {type: integer, minimum: 0}
            trailing_zeros: {type: boolean}
        money:
          type: object
          required: [decimal_separator, group_separator, symbol_mode, symbol_position, decimals_mode]
          properties:
            decimal_separator: {type: string}
            group_separator: {type: string}
            symbol_mode: {type: string}
            symbol_position: {type: string}
            decimals_mode: {type: string}
    DisplaySettingDefinition:
      type: object
      required: [key, category, data_type, default, user_overridable]
      properties:
        key: {type: string}
        category: {type: string}
        data_type: {type: string, enum: [string, integer, boolean]}
        default: {}
        allowed_values: {type: array, items: {}}
        min: {type: integer}
        max: {type: integer}
        user_overridable: {type: boolean}
    DisplaySettingContext:
      oneOf:
        - type: object
          required: [type]
          additionalProperties: false
          properties: {type: {type: string, const: SYSTEM}}
        - type: object
          required: [type, organization_id]
          additionalProperties: false
          properties:
            type: {type: string, const: ORGANIZATION}
            organization_id: {$ref: '#/components/schemas/PositiveBigInt'}
    DisplaySettingValue:
      type: object
      required: [key, override_value, effective_value, source, inherited]
      properties:
        key: {type: string}
        override_value: {}
        effective_value: {}
        source:
          type: object
          required: [type, organization_id]
          properties:
            type: {type: string, enum: [SYSTEM, ORGANIZATION]}
            organization_id: {oneOf: [{$ref: '#/components/schemas/PositiveBigInt'}, {type: 'null'}]}
        inherited: {type: boolean}
    DisplaySettingsPatch:
      type: object
      required: [context, changes]
      additionalProperties: false
      properties:
        context: {$ref: '#/components/schemas/DisplaySettingContext'}
        changes:
          type: array
          minItems: 1
          items:
            type: object
            required: [key, value]
            additionalProperties: false
            properties:
              key: {type: string}
              value: {}
    DisplaySettingsReset:
      type: object
      required: [context, keys]
      additionalProperties: false
      properties:
        context: {$ref: '#/components/schemas/DisplaySettingContext'}
        keys:
          type: array
          minItems: 1
          items: {type: string}
    HealthResponse:
      type: object
      required:
        - data
