openapi: 3.1.0
info:
  title: DinkERP P1 API
  version: 1.0.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: >-
    Gate 0 contract source. Slice-specific operations are added only when their
    authority documents and implementation tasks reach CONTRACT_READY.
servers:
  - url: https://api.monmin.net
security:
  - sessionAuth: []
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Health check
      security: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Service is available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Content-Language:
              $ref: '#/components/headers/ContentLanguage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Authenticate a Shield session user
      security: []
      parameters: [{$ref: '#/components/parameters/AcceptLanguage'}, {$ref: '#/components/parameters/RequestId'}]
      requestBody: {$ref: '#/components/requestBodies/AuthLogin'}
      responses:
        '200': {$ref: '#/components/responses/AuthUserResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
  /api/v1/auth/me:
    get:
      operationId: getCurrentUser
      summary: Get the authenticated session user and Base Permission snapshot
      parameters: [{$ref: '#/components/parameters/AcceptLanguage'}, {$ref: '#/components/parameters/RequestId'}]
      responses:
        '200': {$ref: '#/components/responses/AuthUserResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/auth/profile:
    patch:
      operationId: updateAuthProfile
      summary: Update the authenticated user profile and refresh permissions
      parameters: [{$ref: '#/components/parameters/AcceptLanguage'}, {$ref: '#/components/parameters/RequestId'}]
      requestBody: {$ref: '#/components/requestBodies/AuthProfilePatch'}
      responses:
        '200': {$ref: '#/components/responses/AuthUserResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: End the authenticated Shield session
      parameters: [{$ref: '#/components/parameters/AcceptLanguage'}, {$ref: '#/components/parameters/RequestId'}]
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/display-settings/runtime:
    get:
      operationId: getDisplaySettingsRuntime
      summary: Get the authenticated presentation runtime snapshot
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/DisplayOrganizationId'
      responses:
        '200': {$ref: '#/components/responses/DisplaySettingsRuntimeResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
  /api/v1/display-settings/definitions:
    get:
      operationId: listDisplaySettingDefinitions
      summary: List registered Display Settings definitions
      parameters: [{$ref: '#/components/parameters/AcceptLanguage'}, {$ref: '#/components/parameters/RequestId'}]
      responses:
        '200': {$ref: '#/components/responses/DisplaySettingDefinitionsResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/display-settings/values:
    get:
      operationId: listDisplaySettingValues
      summary: List effective Display Settings values and sources
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/DisplayContextType'
        - $ref: '#/components/parameters/DisplayOrganizationId'
      responses:
        '200': {$ref: '#/components/responses/DisplaySettingValuesResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
  /api/v1/display-settings:
    patch:
      operationId: updateDisplaySettings
      summary: Set a batch of Display Settings overrides
      parameters: [{$ref: '#/components/parameters/AcceptLanguage'}, {$ref: '#/components/parameters/RequestId'}]
      requestBody: {$ref: '#/components/requestBodies/DisplaySettingsPatch'}
      responses:
        '200': {$ref: '#/components/responses/DisplaySettingValuesResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
  /api/v1/display-settings/actions/reset:
    post:
      operationId: resetDisplaySettings
      summary: Reset a batch of Display Settings overrides
      parameters: [{$ref: '#/components/parameters/AcceptLanguage'}, {$ref: '#/components/parameters/RequestId'}]
      requestBody: {$ref: '#/components/requestBodies/DisplaySettingsReset'}
      responses:
        '200': {$ref: '#/components/responses/DisplaySettingValuesResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
