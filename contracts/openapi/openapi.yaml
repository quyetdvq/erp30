      responses: {'200': {$ref: '#/components/responses/ContactCollection'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}}
    post:
      operationId: createContact
      summary: Create a contact
      requestBody: {$ref: '#/components/requestBodies/ContactCreate'}
      responses: {'201': {$ref: '#/components/responses/ContactResponse'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '422': {$ref: '#/components/responses/UnprocessableEntity'}}
  /api/v1/contacts/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
