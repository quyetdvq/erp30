openapi: 3.1.0
info:
  title: DinkERP P1 API
  version: 1.0.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: >-
    Gate 0 contract source. Slice-specific operations are added only when their
    authority documents and implementation tasks reach CONTRACT_READY.
servers:
  - url: https://api.monmin.net
security:
  - sessionAuth: []
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Health check
      security: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Service is available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Content-Language:
              $ref: '#/components/headers/ContentLanguage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/provinces:
    get:
      operationId: listProvinces
      summary: List authorized provinces
      parameters: [{$ref: '#/components/parameters/AcceptLanguage'}, {$ref: '#/components/parameters/RequestId'}, {$ref: '#/components/parameters/Q'}, {$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}, {$ref: '#/components/parameters/Sort'}, {$ref: '#/components/parameters/Filter'}]
      responses:
        '200': {$ref: '#/components/responses/ProvinceCollection'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: createProvince
      summary: Create a province
      requestBody: {$ref: '#/components/requestBodies/ProvinceCreate'}
      responses:
        '201': {$ref: '#/components/responses/ProvinceResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
  /api/v1/provinces/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      operationId: getProvince
      summary: Get a province
      responses: {'200': {$ref: '#/components/responses/ProvinceResponse'}, '401': {$ref: '#/components/responses/Unauthorized'}, '404': {$ref: '#/components/responses/NotFound'}}
    patch:
      operationId: updateProvince
      summary: Update a province
      requestBody: {$ref: '#/components/requestBodies/ProvincePatch'}
      responses: {'200': {$ref: '#/components/responses/ProvinceResponse'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/UnprocessableEntity'}}
  /api/v1/provinces/{id}/actions/set-state:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      operationId: setProvinceState
      summary: Set province state
      requestBody: {$ref: '#/components/requestBodies/State'}
      responses: {'200': {$ref: '#/components/responses/ProvinceResponse'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '422': {$ref: '#/components/responses/UnprocessableEntity'}}
  /api/v1/wards:
    get:
      operationId: listWards
      summary: List authorized wards
      parameters: [{$ref: '#/components/parameters/AcceptLanguage'}, {$ref: '#/components/parameters/RequestId'}, {$ref: '#/components/parameters/Q'}, {$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}, {$ref: '#/components/parameters/Sort'}, {$ref: '#/components/parameters/Filter'}]
      responses: {'200': {$ref: '#/components/responses/WardCollection'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}}
    post:
      operationId: createWard
      summary: Create a ward
      requestBody: {$ref: '#/components/requestBodies/WardCreate'}
      responses: {'201': {$ref: '#/components/responses/WardResponse'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/UnprocessableEntity'}}
  /api/v1/wards/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      operationId: getWard
      summary: Get a ward
      responses: {'200': {$ref: '#/components/responses/WardResponse'}, '401': {$ref: '#/components/responses/Unauthorized'}, '404': {$ref: '#/components/responses/NotFound'}}
    patch:
      operationId: updateWard
