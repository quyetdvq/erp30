      summary: Get an organization
      responses: {'200': {$ref: '#/components/responses/OrganizationResponse'}, '401': {$ref: '#/components/responses/Unauthorized'}, '404': {$ref: '#/components/responses/NotFound'}}
    patch:
      operationId: updateOrganization
      summary: Update an organization
      requestBody: {$ref: '#/components/requestBodies/OrganizationPatch'}
      responses: {'200': {$ref: '#/components/responses/OrganizationResponse'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/UnprocessableEntity'}}
  /api/v1/organizations/{id}/actions/set-state:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      operationId: setOrganizationState
      summary: Set organization state
      requestBody: {$ref: '#/components/requestBodies/State'}
      responses: {'200': {$ref: '#/components/responses/OrganizationResponse'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '422': {$ref: '#/components/responses/UnprocessableEntity'}}
  /api/v1/contacts:
