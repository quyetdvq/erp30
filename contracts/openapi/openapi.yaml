    post:
      operationId: createEmployee
      summary: Create an employee
      requestBody: {$ref: '#/components/requestBodies/EmployeeCreate'}
      responses: {'201': {$ref: '#/components/responses/EmployeeResponse'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/UnprocessableEntity'}}
  /api/v1/employees/{id}:
