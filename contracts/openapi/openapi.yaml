      responses: {'200': {$ref: '#/components/responses/PositionCollection'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}}
    post:
      operationId: createPosition
      summary: Create a position
      requestBody: {$ref: '#/components/requestBodies/PositionCreate'}
      responses: {'201': {$ref: '#/components/responses/PositionResponse'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/UnprocessableEntity'}}
  /api/v1/positions/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      operationId: getPosition
      summary: Get a position
      responses: {'200': {$ref: '#/components/responses/PositionResponse'}, '401': {$ref: '#/components/responses/Unauthorized'}, '404': {$ref: '#/components/responses/NotFound'}}
    patch:
