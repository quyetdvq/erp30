      responses: {'200': {$ref: '#/components/responses/DepartmentResponse'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/UnprocessableEntity'}}
  /api/v1/departments/{id}/actions/set-state:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      operationId: setDepartmentState
