openapi: 3.1.0
info:
  title: DinkERP P2-CUS G1 implementation candidate (DEV UAT pending)
  version: 1.9.4-code-candidate
  description: Customer G1 code exists on a DEV candidate; runtime PBAC, migration and browser UAT remain operator-controlled.
    CUSTOMER_GROUP() has four codes; CORRECTION has an owner-checked reference. Three SAL/FIN read APIs remain deferred.
servers:
- url: https://example.invalid
  description: Document placeholder, NOT a deployment hostname
paths:
  /api/v1/customers:
    get:
      operationId: listCustomers
      summary: Authorized Group Customer master list
      security:
      - sessionAuth: []
      x-design-status: CUS_G1_CODE_CANDIDATE_DEV_UAT_PENDING
      x-pbac-permission: customer.view
      responses:
        '200':
          description: Design response — not deployed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerListResponse'
        '400': &id001
          $ref: '#/components/responses/ErrorResponse'
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '422': *id001
      parameters:
      - &id003
        name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: page_size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      - name: q
        in: query
        schema:
          type: string
      - name: status
        in: query
        schema:
          type: string
          maxLength: 20
          pattern: '^[A-Z][A-Z0-9_:-]{0,19}$'
          description: Canonical status code in the currently configured Customer Lifecycle.
      - name: customer_type
        in: query
        schema:
          type: string
          enum:
          - INDIVIDUAL
          - ORGANIZATION
      - name: customer_group_code
        in: query
        schema:
          type: string
          enum:
          - STANDARD
          - TMDT
          - VIP1
          - VIP2
      - name: company_id
        in: query
        description: Business usage eligibility filter only; does not grant PBAC
        schema:
          type: integer
          minimum: 1
      - name: sort
        in: query
        description: Single allowlisted sort; prepend minus for DESC; stable id tiebreak
        schema:
          type: string
          enum: [name, -name, customer_code, -customer_code, id, -id]
          default: name
      x-g1-technical-approved: true
    post:
      operationId: createCustomer
      summary: Create Group-shared Customer and Company allowlist atomically
      security:
      - sessionAuth: []
      x-design-status: CUS_G1_CODE_CANDIDATE_DEV_UAT_PENDING
      x-pbac-permission: customer.create
      responses:
        '201':
          description: Design response — not deployed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '422': *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerCreate'
      x-g1-technical-approved: true
  /api/v1/customers/{id}:
    parameters:
    - &id002
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    get:
      operationId: getCustomer
      summary: Read Customer master + permitted Company usage
      security:
      - sessionAuth: []
      x-design-status: CUS_G1_CODE_CANDIDATE_DEV_UAT_PENDING
      x-pbac-permission: customer.view
      responses:
        '200':
          description: Design response — not deployed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerItemResponse'
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '422': *id001
      x-g1-technical-approved: true
    patch:
      operationId: updateCustomer
      summary: Update mutable Customer master and Company allowlist
      security:
      - sessionAuth: []
      x-design-status: CUS_G1_CODE_CANDIDATE_DEV_UAT_PENDING
      x-pbac-permission: customer.edit
      responses:
        '200':
          description: Design response — not deployed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '422': *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerPatch'
      x-g1-technical-approved: true
  /api/v1/customers/{id}/actions/set-state:
    parameters:
    - *id002
    post:
      operationId: setCustomerState
      summary: Execute P1 Workflow-approved state transition
      security:
      - sessionAuth: []
      x-design-status: CUS_G1_CODE_CANDIDATE_DEV_UAT_PENDING
      x-pbac-permission: customer.setstate
      responses:
        '200':
          description: Design response — not deployed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '422': *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StateChange'
      x-g1-technical-approved: true
  /api/v1/customers/{id}/interactions:
    parameters:
    - *id002
    get:
      operationId: listCustomerInteractions
      summary: List Company-scoped append-only Customer interactions
      security:
      - sessionAuth: []
      x-design-status: CUS_G1_CODE_CANDIDATE_DEV_UAT_PENDING
      x-pbac-permission: customer_interaction.view
      responses:
        '200':
          description: Design response — not deployed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '422': *id001
      parameters:
      - name: company_id
        in: query
        required: true
        schema:
          type: integer
          minimum: 1
      - *id003
      - name: page_size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      - name: activity_type
        in: query
        schema:
          $ref: '#/components/schemas/CustomerInteractionActivityType'
      - name: from
        in: query
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        schema:
          type: string
          format: date-time
      x-g1-technical-approved: true
    post:
      operationId: createCustomerInteraction
      summary: Append Company-scoped Customer interaction
      security:
      - sessionAuth: []
      x-design-status: CUS_G1_CODE_CANDIDATE_DEV_UAT_PENDING
      x-pbac-permission: customer_interaction.create
      responses:
        '201':
          description: Design response — not deployed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '422': *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerInteractionCreate'
      x-g1-technical-approved: true
      description: 'APPROVED design only: CORRECTION requires corrects_interaction_id same Customer and Company, earlier
        non-CORRECTION; happened_at omitted and server-generated.'
  /api/v1/customers/{id}/transactions:
    parameters:
    - *id002
    get:
      operationId: listCustomerTransactions
      summary: Read authorized SAL/FIN Customer timeline (future)
      security:
      - sessionAuth: []
      x-design-status: DEPENDENCY_PENDING
      x-pbac-permission: source.view (per resource) + Company scope
      responses:
        '200':
          description: Design response — not deployed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '422': *id001
      parameters:
      - &id004
        name: company_ids
        in: query
        required: false
        schema:
          type: string
        description: Comma-separated Company Organization IDs; permission intersection required.
      - *id003
      - name: source
        in: query
        schema:
          type: string
      - name: from
        in: query
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        schema:
          type: string
          format: date-time
  /api/v1/customers/{id}/sales-summary:
    parameters:
    - *id002
    get:
      operationId: getCustomerSalesSummary
      summary: Read confirmed/fulfilled/net sales summary from SAL+INV (future)
      security:
      - sessionAuth: []
      x-design-status: DEPENDENCY_PENDING
      x-pbac-permission: sales_order.view + related source views
      responses:
        '200':
          description: Design response — not deployed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '422': *id001
      parameters:
      - *id004
      - name: from
        in: query
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        schema:
          type: string
          format: date-time
  /api/v1/customers/{id}/receivables:
    parameters:
    - *id002
    get:
      operationId: getCustomerReceivables
      summary: Read operational order receivables from SAL+FIN (future)
      security:
      - sessionAuth: []
      x-design-status: DEPENDENCY_PENDING
      x-pbac-permission: sales_order.view + money_receipt.view + related permissions
      responses:
        '200':
          description: Design response — not deployed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '422': *id001
      parameters:
      - *id004
      - name: as_of
        in: query
        schema:
          type: string
          format: date-time
      - *id003
components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: ci_session
      description: Placeholder cookie name — actual CI4 session configuration from P1 runtime must be used; not API route
        authority.
  schemas:
    CustomerCreate:
      type: object
      properties:
        customer_code: &id005
          type: string
          maxLength: 50
        name: &id006
          type: string
          minLength: 1
          maxLength: 255
        customer_type: &id007
          type: string
          enum:
          - INDIVIDUAL
          - ORGANIZATION
        customer_group_code:
          $ref: '#/components/schemas/CustomerGroupCode'
        phone: &id008
          type: string
          minLength: 7
          maxLength: 50
          description: Required on create. 7–15 digits, optionally formatted with separators; duplicate numbers across all Customers are rejected (409 CUSTOMER_PHONE_DUPLICATE). +84/0084/84 and domestic 0 are treated as equivalent for nine-digit Vietnamese subscriber numbers.
        email: &id009
          anyOf:
          - type: string
          - type: 'null'
        tax_code: &id010
          anyOf:
          - type: string
          - type: 'null'
        address: &id011
          type: string
          minLength: 1
          description: Required nonblank main address.
        province_id: &id012
          type: integer
          minimum: 1
          description: Required on Customer create; must be a valid Province/Ward pair.
        ward_id: &id013
          type: integer
          minimum: 1
          description: Required on Customer create; must be a valid Province/Ward pair.
        primary_contact_id: &id014
          anyOf:
          - type: integer
          - type: 'null'
        all_companies: &id015
          type: boolean
        company_ids: &id016
          type: array
          items:
            type: integer
            minimum: 1
          uniqueItems: true
      required:
      - name
      - phone
      - address
      - province_id
      - ward_id
      - all_companies
      additionalProperties: false
      x-create-defaults:
        customer_type: INDIVIDUAL
        customer_group_code: STANDARD
      x-individual-primary-contact:
        contact_type: CUSTOMER
        description: Địa chỉ chính
        mobile_from: phone
        linked_field: primary_contact_id
        atomic_with_customer: true
        required_permission: customer_contact.create
        lifecycle_initial: customer_contact
      description: >-
        If customer_type is omitted on POST, use INDIVIDUAL. If customer_group_code
        is omitted, use STANDARD; an explicit null group remains ungrouped. On
        INDIVIDUAL creation the server creates one Contact owned by CUSTOMER and
        links primary_contact_id atomically; Contact name, phone/mobile, email,
        address and Province/Ward are copied from the normalized Customer POST.
        Contact creation requires effective customer_contact.create PBAC and uses
        the existing Contact Lifecycle initial state. Phone, main address,
        Province and Ward are mandatory for any new Customer. A normalized,
        Customer-wide unique phone key prevents duplicate Customers, including
        concurrent requests, without revealing another Customer's identity.
        Failure rolls back Customer,
        Contact and Numbering counter. Organization creation does not create a
        Contact automatically. Omitting customer_code (or sending blank) requests
        the ACTIVE default Numbering series; with no series, a manual code is required.
    CustomerPatch:
      type: object
      properties:
        customer_code: *id005
        name: *id006
        customer_type: *id007
        customer_group_code:
          $ref: '#/components/schemas/CustomerGroupCode'
        phone: *id008
        email: *id009
        tax_code: *id010
        address: *id011
        province_id: *id012
        ward_id: *id013
        primary_contact_id: *id014
        all_companies: *id015
        company_ids: *id016
      minProperties: 1
      additionalProperties: false
    Customer:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
          readOnly: true
        customer_code: *id005
        name: *id006
        customer_type: *id007
        customer_group_code:
          $ref: '#/components/schemas/CustomerGroupCode'
        phone:
          anyOf:
          - type: string
          - type: 'null'
        email: *id009
        tax_code: *id010
        address:
          anyOf:
          - type: string
          - type: 'null'
        province_id:
          anyOf:
          - type: integer
          - type: 'null'
        ward_id:
          anyOf:
          - type: integer
          - type: 'null'
        primary_contact_id: *id014
        all_companies: *id015
        company_ids: *id016
        status:
          type: string
          maxLength: 20
          pattern: '^[A-Z][A-Z0-9_:-]{0,19}$'
          description: Canonical status code in the currently configured Customer Lifecycle.
          readOnly: true
        allowed_actions:
          $ref: '#/components/schemas/CustomerRowActionHints'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
      required:
      - id
      - customer_code
      - name
      - customer_type
      - all_companies
      - status
      - allowed_actions
      additionalProperties: false
    CustomerRowActionHints:
      type: object
      readOnly: true
      description: Advisory effective PBAC hints for UI icons; mutation always rechecks persisted ResourceAction + policy.
      properties:
        edit:
          type: boolean
        setstate:
          type: boolean
      required: [edit, setstate]
      additionalProperties: false
    CustomerListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Customer'
        meta:
          $ref: '#/components/schemas/CustomerPageMeta'
    CustomerPageMeta:
      type: object
      required: [page, page_size, total]
      properties:
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
        request_id: { type: string }
    CustomerItemResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/Customer'
        meta: { type: object }
    StateChange:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          maxLength: 20
          pattern: '^[A-Z][A-Z0-9_:-]{0,19}$'
          description: Canonical status code in the currently configured Customer Lifecycle.
      additionalProperties: false
    CustomerInteractionCreate:
      type: object
      properties:
        company_organization_id:
          type: integer
          minimum: 1
        activity_type:
          $ref: '#/components/schemas/CustomerInteractionActivityType'
        content:
          type: string
          minLength: 1
        happened_at:
          type: string
          format: date-time
          description: Optional for ordinary event, server-now default; prohibited for CORRECTION (server timestamp).
        corrects_interaction_id:
          oneOf:
          - type: integer
            minimum: 1
          - type: 'null'
          description: Required iff CORRECTION; original must be earlier non-CORRECTION of same customer and company.
      required:
      - company_organization_id
      - activity_type
      - content
      additionalProperties: false
      allOf:
      - if:
          properties:
            activity_type:
              const: CORRECTION
          required:
          - activity_type
        then:
          required:
          - corrects_interaction_id
          properties:
            corrects_interaction_id:
              type: integer
              minimum: 1
          not:
            required:
            - happened_at
        else:
          properties:
            corrects_interaction_id:
              type: 'null'
    CustomerInteraction:
      type: object
      properties:
        id:
          type: integer
        customer_id:
          type: integer
        company_organization_id:
          type: integer
        activity_type:
          $ref: '#/components/schemas/CustomerInteractionActivityType'
        content:
          type: string
        happened_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        corrects_interaction_id:
          oneOf:
          - type: integer
            minimum: 1
          - type: 'null'
        created_by:
          oneOf:
          - type: integer
            minimum: 1
          - type: 'null'
      description: Append-only activity; CORRECTION link is server validated against same Customer and Company.
    DecimalVnd:
      type: string
      pattern: ^-?(?:0|[1-9][0-9]*)\.[0-9]{2}$
      description: VND canonical decimal string. No formatted currency or IEEE float.
    MetricAvailability:
      type: string
      enum:
      - READY
      - DEPENDENCY_PENDING
      - NOT_AUTHORIZED
    CustomerSalesSummary:
      type: object
      properties:
        confirmed_order_value:
          $ref: '#/components/schemas/DecimalVnd'
        fulfilled_goods_value:
          $ref: '#/components/schemas/DecimalVnd'
        net_sales_operational:
          $ref: '#/components/schemas/DecimalVnd'
        metric_status:
          $ref: '#/components/schemas/MetricAvailability'
        company_ids:
          type: array
          items:
            type: integer
    CustomerReceivableRow:
      type: object
      properties:
        sales_order_id:
          type: integer
        company_id:
          type: integer
        as_of:
          type: string
          format: date-time
        due_date:
          anyOf:
          - type: string
          - type: 'null'
        open_due:
          $ref: '#/components/schemas/DecimalVnd'
        overpayment:
          $ref: '#/components/schemas/DecimalVnd'
        aging_bucket:
          type: string
          enum:
          - CURRENT
          - '1_30'
          - '31_60'
          - '61_90'
          - OVER_90
          - UNKNOWN_DUE_DATE
    SuccessResponse:
      type: object
      required:
      - data
      - meta
      properties:
        data: {}
        meta:
          type: object
          properties:
            request_id:
              type: string
            page:
              type: integer
            page_size:
              type: integer
            total:
              type: integer
    ErrorResponse:
      type: object
      required:
      - error
      - meta
      properties:
        error:
          type: object
          required:
          - code
          - message
          - details
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: object
        meta:
          type: object
          required:
          - request_id
          properties:
            request_id:
              type: string
    CustomerGroupCode:
      description: Nullable Group-shared Customer segment key from planned PHP CUSTOMER_GROUP(); NULL means unassigned;
        NOT a numeric FK or marketplace channel.
      oneOf:
      - type: string
        enum:
        - STANDARD
        - TMDT
        - VIP1
        - VIP2
      - type: 'null'
      x-php-catalog-function: CUSTOMER_GROUP
    CustomerInteractionActivityType:
      type: string
      enum:
      - NOTE
      - CALL
      - EMAIL
      - MEETING
      - CORRECTION
  responses:
    ErrorResponse:
      description: P1-compatible structured error, exact status depends on route
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
x-cus-design-approval:
  gate: CUS_G1_READY_FOR_IMPLEMENTATION
  approved_technical_decisions: 7
  approved_business_decisions: 12
  runtime_implemented: false
  source_module_xmod_open: 9
